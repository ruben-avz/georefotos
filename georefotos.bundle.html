<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoRefotos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  background: #1e293b;
  color: #fff;
  flex-wrap: wrap;
}

.toolbar__title {
  font-size: 1.1rem;
  margin: 0;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.btn {
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0.45rem 0.9rem;
  font-size: 0.9rem;
  cursor: pointer;
}

.btn:hover {
  background: #1d4ed8;
}

.btn--small {
  padding: 0.3rem 0.6rem;
  font-size: 0.8rem;
  margin-top: 0.4rem;
}

.btn--secondary {
  background: #475569;
}

.btn--secondary:hover {
  background: #334155;
}

.btn--save {
  background: #16a34a;
}

.btn--save:hover {
  background: #15803d;
}

.btn:disabled {
  opacity: 0.6;
  cursor: default;
}

.status {
  font-size: 0.85rem;
  color: #cbd5e1;
}

.scale-control {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: #cbd5e1;
}

.scale-control input[type="range"] {
  width: 90px;
}

.scale-control span {
  min-width: 1.6em;
  font-variant-numeric: tabular-nums;
}

#map {
  flex: 1;
  min-height: 0;
}

/* Marcador de foto: punto + flecha de azimut opcional.
   No se declara position aquí: Leaflet ya pone position:absolute vía su clase
   .leaflet-marker-icon (imprescindible para su transform:translate3d). Sobreescribirla
   con relative rompe el posicionamiento del marcador (efecto "flota hacia la posición
   correcta al hacer zoom"), porque pasa a colocarse en su posición de flujo normal
   más el offset de Leaflet, en vez de desde el origen del mapa. */
.photo-marker {
  width: 28px;
  height: 28px;
}

.photo-marker__dot {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #2563eb;
  border: 2px solid #fff;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 3px rgba(0, 0, 0, 0.6);
}

.photo-marker__dot--editing {
  background: #f59e0b;
  box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.35);
}

.photo-marker__dot--dirty {
  background: #f97316;
}

.photo-marker__dot--saved-edit {
  background: #16a34a;
}

.photo-marker__arrow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 14px solid #2563eb;
  transform-origin: 50% 100%;
  /* Contorno blanco para que se vea sobre cualquier fondo de la ortofoto */
  filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff);
}

/* Halo y manejador para editar el azimut arrastrando alrededor del punto */
.azimuth-halo {
  border-radius: 50%;
  border: 2px dashed rgba(245, 158, 11, 0.85);
  background: rgba(245, 158, 11, 0.08);
  pointer-events: none;
}

.azimuth-handle {
  border-radius: 50%;
  background: #f59e0b;
  border: 2px solid #fff;
  box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
  cursor: grab;
}

.azimuth-handle:active {
  cursor: grabbing;
}

/* Popup de foto */
.popup {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  width: 220px;
}

.popup__thumb {
  width: 100%;
  border-radius: 4px;
  background: #e2e8f0;
  min-height: 120px;
  object-fit: cover;
}

.popup__thumb--loading {
  opacity: 0.4;
}

.popup__thumb--error {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0.5rem;
  font-size: 0.78rem;
  color: #64748b;
  border: 1px dashed #cbd5e1;
}

.popup__info {
  margin: 0;
  font-size: 0.78rem;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.15rem 0.5rem;
}

.popup__info dt {
  color: #64748b;
  font-weight: 600;
}

.popup__info dd {
  margin: 0;
  word-break: break-word;
}

.popup__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.popup__hint {
  margin: 0;
  font-size: 0.75rem;
  color: #b45309;
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-radius: 4px;
  padding: 0.3rem 0.5rem;
}

/* Visor de imagen a tamaño completo */
.lightbox[hidden] {
  display: none;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.lightbox__img {
  max-width: 92vw;
  max-height: 92vh;
  box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
}

.lightbox__close {
  position: absolute;
  top: 1rem;
  right: 1.2rem;
  background: none;
  border: none;
  color: #fff;
  font-size: 2.2rem;
  line-height: 1;
  cursor: pointer;
}

</style>
</head>
<body>
<header class="toolbar">
  <h1 class="toolbar__title">GeoRefotos</h1>
  <button id="select-folder-btn" class="btn" type="button">Seleccionar carpeta&hellip;</button>
  <input id="folder-input" type="file" webkitdirectory directory multiple accept="image/*" hidden />
  <button id="save-changes-btn" class="btn btn--save" type="button" hidden>Guardar cambios</button>
  <label class="scale-control">
    Tamaño de los puntos
    <input id="marker-scale" type="range" min="0" max="2" step="1" value="0" list="marker-scale-ticks" />
    <datalist id="marker-scale-ticks">
      <option value="0"></option>
      <option value="1"></option>
      <option value="2"></option>
    </datalist>
    <span id="marker-scale-label">x1</span>
  </label>
  <span id="status" class="status">Selecciona una carpeta con fotos para empezar.</span>
</header>

<main id="map"></main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox__close" aria-label="Cerrar" type="button">&times;</button>
  <img id="lightbox-img" class="lightbox__img" alt="Foto a tamaño completo" />
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
<script>
// Configuración de capas base del mapa.
// Para añadir una nueva capa (mapa topogràfic ICGC, OSM, Cadastre...) basta con
// añadir un nuevo objeto a BASE_LAYERS siguiendo el mismo esquema, y buildBaseLayers()
// lo incorporará automáticamente al selector de capas de Leaflet.
//
// Ejemplo de capa futura (OpenStreetMap):
// {
//   id: 'osm',
//   label: 'OpenStreetMap',
//   url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
//   options: { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }
// }

const BASE_LAYERS = [
  {
    // Servei de Mapa Base del ICGC (capa "orto"): ortofoto de alta resolución dentro de
    // Catalunya, completada fuera del territorio con imágenes de OpenMapTiles/OSM para dar contexto.
    id: 'icgc-orto',
    label: 'Ortofoto ICGC',
    url: 'https://geoserveis.icgc.cat/servei/catalunya/mapa-base/wmts/orto/MON3857NW/{z}/{x}/{y}.png',
    options: {
      maxZoom: 20,
      minZoom: 5,
      attribution:
        '&copy; <a href="https://www.icgc.cat/" target="_blank" rel="noopener">Institut Cartogràfic i Geològic de Catalunya</a>'
    }
  }
];

// Capas superpuestas (overlays) que se pueden combinar con la capa base.
// De momento solo contiene el grupo de marcadores de fotos, que se añade en app.js.
const OVERLAY_LAYERS = [];

function buildBaseLayers() {
  const layers = {};
  BASE_LAYERS.forEach((cfg) => {
    layers[cfg.label] = L.tileLayer(cfg.url, cfg.options);
  });
  return layers;
}

</script>
<script>
// GeoRefotos: escritura de la corrección de ubicación y/o azimut en una copia editada.
//
// Los originales nunca se modifican. Cada corrección se guarda como una copia en la
// carpeta "editadas" (dentro de la carpeta seleccionada): JPEG con el bloque GPS del EXIF
// reescrito (se conserva el resto de metadatos), o HEIC/HEIF convertido a JPEG con un EXIF
// nuevo (fecha, dispositivo, GPS, azimut), ya que los navegadores no saben escribir EXIF
// dentro de un contenedor HEIC. Ediciones sucesivas de la misma foto sobreescriben la misma
// copia editada (el nombre de archivo destino es siempre el mismo, derivado de la ruta del
// original).

const EDITED_FOLDER_NAME = 'editadas';

function editedFileName(relativePath) {
  const flat = relativePath.replace(/\//g, '__');
  const ext = getExtensionFromName(flat);
  if (ext === 'heic' || ext === 'heif') {
    return `${flat.slice(0, -(ext.length + 1))}.jpg`;
  }
  return flat;
}

function decimalToDmsRational(value) {
  const abs = Math.abs(value);
  const degrees = Math.floor(abs);
  const minutesFloat = (abs - degrees) * 60;
  const minutes = Math.floor(minutesFloat);
  const seconds = Math.round((minutesFloat - minutes) * 60 * 100);
  return [[degrees, 1], [minutes, 1], [seconds, 100]];
}

function buildGpsIfd(lat, lon, azimuth) {
  const gps = {
    [piexif.GPSIFD.GPSVersionID]: [2, 3, 0, 0],
    [piexif.GPSIFD.GPSLatitudeRef]: lat >= 0 ? 'N' : 'S',
    [piexif.GPSIFD.GPSLatitude]: decimalToDmsRational(lat),
    [piexif.GPSIFD.GPSLongitudeRef]: lon >= 0 ? 'E' : 'W',
    [piexif.GPSIFD.GPSLongitude]: decimalToDmsRational(lon)
  };
  if (azimuth != null) {
    gps[piexif.GPSIFD.GPSImgDirectionRef] = 'T';
    gps[piexif.GPSIFD.GPSImgDirection] = [Math.round(azimuth * 100), 100];
  }
  return gps;
}

function formatExifDate(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}:${pad(date.getMonth() + 1)}:${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function dataURLToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(',');
  const mime = header.match(/data:(.*?);base64/)[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function buildJpegExportBlob(photo) {
  const dataUrl = await blobToDataURL(photo.file);
  let exifObj;
  try {
    exifObj = piexif.load(dataUrl);
  } catch (err) {
    exifObj = { '0th': {}, Exif: {}, GPS: {}, '1st': {}, thumbnail: null };
  }
  exifObj.GPS = buildGpsIfd(effectiveLat(photo), effectiveLon(photo), effectiveAzimuth(photo));
  const exifBytes = piexif.dump(exifObj);
  const newDataUrl = piexif.insert(exifBytes, dataUrl);
  return dataURLToBlob(newDataUrl);
}

async function buildHeicExportBlob(photo) {
  const jpegBlob = await getDisplayableBlob(photo);
  const dataUrl = await blobToDataURL(jpegBlob);

  const exifObj = { '0th': {}, Exif: {}, GPS: {}, '1st': {}, thumbnail: null };
  if (photo.make) exifObj['0th'][piexif.ImageIFD.Make] = photo.make;
  if (photo.model) exifObj['0th'][piexif.ImageIFD.Model] = photo.model;
  if (photo.date) exifObj.Exif[piexif.ExifIFD.DateTimeOriginal] = formatExifDate(photo.date);
  exifObj.GPS = buildGpsIfd(effectiveLat(photo), effectiveLon(photo), effectiveAzimuth(photo));

  const exifBytes = piexif.dump(exifObj);
  const newDataUrl = piexif.insert(exifBytes, dataUrl);
  return dataURLToBlob(newDataUrl);
}

async function savePhotoLocation(photo, editadasDirHandle) {
  const ext = getExtension(photo.file);
  let blob;
  if (ext === 'heic' || ext === 'heif') {
    blob = await buildHeicExportBlob(photo);
  } else if (ext === 'jpg' || ext === 'jpeg') {
    blob = await buildJpegExportBlob(photo);
  } else {
    throw new Error(`Formato .${ext} no soportado para guardar la corrección`);
  }

  const targetName = editedFileName(photo.relativePath);
  const fileHandle = await editadasDirHandle.getFileHandle(targetName, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(blob);
  await writable.close();
  photo.hasSavedEdit = true;
}

</script>
<script>
// GeoRefotos: visor de fotos georreferenciadas sobre la ortofoto del ICGC.

const CATALONIA_CENTER = [41.82, 1.86];
const DEFAULT_ZOOM = 8;

const map = L.map('map', { zoomControl: true }).setView(CATALONIA_CENTER, DEFAULT_ZOOM);

const baseLayers = buildBaseLayers();
const firstBaseLayerName = Object.keys(baseLayers)[0];
baseLayers[firstBaseLayerName].addTo(map);

const photosLayer = L.layerGroup().addTo(map);
L.control.layers(baseLayers, { Fotos: photosLayer }, { collapsed: false }).addTo(map);

const folderInput = document.getElementById('folder-input');
const selectFolderBtn = document.getElementById('select-folder-btn');
const saveChangesBtn = document.getElementById('save-changes-btn');
const markerScaleInput = document.getElementById('marker-scale');
const markerScaleLabel = document.getElementById('marker-scale-label');
const statusEl = document.getElementById('status');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

let currentLightboxUrl = null;
let photos = [];
let hasWriteAccess = false; // true solo si la carpeta se abrió con File System Access API
let currentRootName = '';
let rootDirHandle = null;
let editadasDirHandle = null; // carpeta "editadas" dentro de la carpeta seleccionada

const MARKER_SCALES = [1, 2, 4];
const BASE_ICON_SIZE = 28;
const BASE_DOT_SIZE = 12;
const BASE_ARROW_SIDE = 6;
const BASE_ARROW_LENGTH = 14;
const BASE_HALO_RADIUS = 34;
let markerScale = MARKER_SCALES[Number(markerScaleInput.value)];

markerScaleInput.addEventListener('input', () => {
  markerScale = MARKER_SCALES[Number(markerScaleInput.value)];
  markerScaleLabel.textContent = `x${markerScale}`;
  photos.forEach((photo) => photo.marker.setIcon(buildMarkerIcon(photo)));
});

// El File.type del navegador no es fiable para HEIC/HEIF en Windows (suele venir vacío),
// así que además de mirar el MIME se filtra por extensión.
const IMAGE_EXTENSIONS = ['jpg', 'jpeg', 'png', 'heic', 'heif', 'webp', 'gif', 'bmp', 'tif', 'tiff'];

function getExtensionFromName(name) {
  const dot = name.lastIndexOf('.');
  return dot === -1 ? '' : name.slice(dot + 1).toLowerCase();
}

function getExtension(file) {
  return getExtensionFromName(file.name);
}

function isImageFile(file) {
  return file.type.startsWith('image/') || IMAGE_EXTENSIONS.includes(getExtension(file));
}

function isHeicFile(file) {
  const ext = getExtension(file);
  return ext === 'heic' || ext === 'heif' || file.type === 'image/heic' || file.type === 'image/heif';
}

// Valores "vigentes" de una foto: el pendiente de guardar si lo hay, si no el guardado/original.
function effectiveLat(photo) {
  return photo.editedLat != null ? photo.editedLat : photo.lat;
}
function effectiveLon(photo) {
  return photo.editedLon != null ? photo.editedLon : photo.lon;
}
// editedAzimuthCleared distingue "sin cambio pendiente" (null) de "pendiente: quitar el
// azimut" (necesario para poder revertir a un original que no tenía azimut).
function effectiveAzimuth(photo) {
  if (photo.editedAzimuthCleared) return null;
  return photo.editedAzimuth != null ? photo.editedAzimuth : photo.azimuth;
}
// Azimut a mostrar mientras se edita: si la foto no tenía azimut, se parte del norte.
function displayAzimuth(photo) {
  if (photo.editedAzimuthCleared) return null;
  if (photo.editedAzimuth != null) return photo.editedAzimuth;
  if (photo.editingAzimuth && photo.azimuth == null) return 0;
  return photo.azimuth;
}
function isDirty(photo) {
  return photo.editedLat != null || photo.editedAzimuth != null || photo.editedAzimuthCleared;
}

// Las copias corregidas viven en una carpeta "editadas" junto a los originales; se
// excluye de la lista de fotos para no contarla como una carpeta más de originales.
function isInsideEditedFolder(relativePath) {
  return relativePath.split('/').slice(0, -1).includes(EDITED_FOLDER_NAME);
}

selectFolderBtn.addEventListener('click', selectFolder);
folderInput.addEventListener('change', (event) => {
  hasWriteAccess = false;
  currentRootName = '';
  rootDirHandle = null;
  editadasDirHandle = null;
  const items = Array.from(event.target.files)
    .filter(isImageFile)
    .filter((file) => !isInsideEditedFolder(file.webkitRelativePath || file.name))
    .map((file) => ({ file, handle: null, dirHandle: null, relativePath: file.webkitRelativePath || file.name }));
  handleFileList(items);
  folderInput.value = '';
});

saveChangesBtn.addEventListener('click', saveAllChanges);

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (event) => {
  if (event.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
});

window.addEventListener('beforeunload', (event) => {
  if (hasPendingChanges()) {
    event.preventDefault();
    event.returnValue = '';
  }
});

// El halo del editor de azimut tiene tamaño fijo en píxeles y sigue al zoom solo,
// pero el manejador se coloca en una coordenada geográfica: hay que recalcularla en
// cada cambio de zoom para que no se quede "por dentro" del halo (o se salga de él).
map.on('zoom', () => {
  photos.forEach((photo) => {
    if (photo.editingAzimuth) repositionAzimuthHandle(photo);
  });
});

async function selectFolder() {
  if (window.showDirectoryPicker) {
    let dirHandle;
    try {
      dirHandle = await window.showDirectoryPicker();
    } catch (err) {
      return; // el usuario ha cancelado el selector
    }
    if (hasPendingChanges() && !confirm('Hay correcciones de ubicación sin guardar que se perderán. ¿Continuar?')) {
      return;
    }
    hasWriteAccess = true;
    currentRootName = dirHandle.name;
    rootDirHandle = dirHandle;
    try {
      editadasDirHandle = await dirHandle.getDirectoryHandle(EDITED_FOLDER_NAME, { create: false });
    } catch (err) {
      editadasDirHandle = null; // todavía no existe: se creará en el primer guardado
    }
    statusEl.textContent = 'Buscando fotos...';
    try {
      const entries = await collectImageEntries(dirHandle);
      const items = [];
      for (const entry of entries) {
        items.push({ file: await entry.handle.getFile(), handle: entry.handle, dirHandle: entry.dirHandle, relativePath: entry.relativePath });
      }
      await handleFileList(items);
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'No se ha podido leer la carpeta seleccionada.';
    }
  } else {
    if (hasPendingChanges() && !confirm('Hay correcciones de ubicación sin guardar que se perderán. ¿Continuar?')) {
      return;
    }
    folderInput.click();
  }
}

async function collectImageEntries(dirHandle, relativePath = '') {
  const results = [];
  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind === 'directory' && name === EDITED_FOLDER_NAME) continue;
    const entryPath = relativePath ? `${relativePath}/${name}` : name;
    if (handle.kind === 'file') {
      if (IMAGE_EXTENSIONS.includes(getExtensionFromName(name))) {
        results.push({ handle, dirHandle, relativePath: entryPath });
      }
    } else if (handle.kind === 'directory') {
      results.push(...(await collectImageEntries(handle, entryPath)));
    }
  }
  return results;
}

async function handleFileList(items) {
  if (items.length === 0) {
    statusEl.textContent = 'No se han encontrado imágenes en la carpeta seleccionada.';
    return;
  }

  photosLayer.clearLayers();
  photos = [];
  updateSaveButton();
  statusEl.textContent = `Procesando ${items.length} imágenes...`;

  let located = 0;
  let skipped = 0;
  const bounds = [];

  for (const item of items) {
    const photo = await readPhoto(item);
    if (!photo) {
      skipped += 1;
      continue;
    }
    located += 1;
    photos.push(photo);
    addPhotoMarker(photo);
    restorePendingFromCache(photo);
    bounds.push([effectiveLat(photo), effectiveLon(photo)]);
  }

  const writeNote = hasWriteAccess
    ? ''
    : window.showDirectoryPicker
      ? ' · corrección de ubicación no disponible en este navegador'
      : ' · corrección de ubicación no disponible (usa Chrome o Edge; Brave y Firefox la bloquean)';
  statusEl.textContent = `${located} fotos ubicadas · ${skipped} sin datos GPS${writeNote}`;

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 18 });
  }
  updateSaveButton();
}

async function readPhoto(item) {
  try {
    const exif = await exifr.parse(item.file, { tiff: true, exif: true, gps: true, translateValues: true });
    if (!exif || typeof exif.latitude !== 'number' || typeof exif.longitude !== 'number') {
      return null;
    }
    const originalAzimuth = typeof exif.GPSImgDirection === 'number' ? exif.GPSImgDirection : null;
    const photo = {
      file: item.file,
      handle: item.handle,
      dirHandle: item.dirHandle,
      relativePath: item.relativePath,
      originalLat: exif.latitude,
      originalLon: exif.longitude,
      lat: exif.latitude,
      lon: exif.longitude,
      editedLat: null,
      editedLon: null,
      editingLocation: false,
      originalAzimuth,
      azimuth: originalAzimuth,
      editedAzimuth: null,
      editedAzimuthCleared: false,
      editingAzimuth: false,
      azimuthHalo: null,
      azimuthHandle: null,
      hasSavedEdit: false,
      date: exif.DateTimeOriginal instanceof Date ? exif.DateTimeOriginal : null,
      make: exif.Make || '',
      model: exif.Model || '',
      thumbnail: null,
      displayBlob: null,
      marker: null
    };
    await applySavedEditIfExists(photo);
    return photo;
  } catch (err) {
    return null;
  }
}

// Si ya existe una copia corregida en /editadas para esta foto, se usa su ubicación/azimut
// como los valores "vigentes" (el original nunca se toca, se conserva en photo.originalLat/Lon/Azimuth).
async function applySavedEditIfExists(photo) {
  if (!editadasDirHandle) return;
  try {
    const name = editedFileName(photo.relativePath);
    const fileHandle = await editadasDirHandle.getFileHandle(name);
    const editedFile = await fileHandle.getFile();
    const editedExif = await exifr.parse(editedFile, { gps: true });
    if (editedExif && typeof editedExif.latitude === 'number') {
      photo.lat = editedExif.latitude;
      photo.lon = editedExif.longitude;
      photo.hasSavedEdit = true;
    }
    if (editedExif && typeof editedExif.GPSImgDirection === 'number') {
      photo.azimuth = editedExif.GPSImgDirection;
      photo.hasSavedEdit = true;
    }
  } catch (err) {
    // No existe copia editada todavía para esta foto: es el caso normal.
  }
}

function addPhotoMarker(photo) {
  const marker = L.marker([photo.lat, photo.lon], { icon: buildMarkerIcon(photo) });
  marker.bindPopup(() => buildPopupContent(photo), { maxWidth: 260 });
  marker.on('dragend', () => onMarkerDragEnd(photo));
  marker.addTo(photosLayer);
  photo.marker = marker;
}

function buildMarkerIcon(photo) {
  const iconSize = BASE_ICON_SIZE * markerScale;
  const dotSize = BASE_DOT_SIZE * markerScale;
  const arrowSide = BASE_ARROW_SIDE * markerScale;
  const arrowLength = BASE_ARROW_LENGTH * markerScale;

  const azimuth = displayAzimuth(photo);
  const arrowHtml =
    azimuth != null
      ? `<div class="photo-marker__arrow" style="border-left-width: ${arrowSide}px; border-right-width: ${arrowSide}px; border-bottom-width: ${arrowLength}px; transform: translate(-50%, -100%) rotate(${azimuth}deg);"></div>`
      : '';
  let dotClass = 'photo-marker__dot';
  if (photo.editingLocation || photo.editingAzimuth) dotClass += ' photo-marker__dot--editing';
  else if (isDirty(photo)) dotClass += ' photo-marker__dot--dirty';
  else if (photo.hasSavedEdit) dotClass += ' photo-marker__dot--saved-edit';
  return L.divIcon({
    className: 'photo-marker',
    html: `${arrowHtml}<div class="${dotClass}" style="width: ${dotSize}px; height: ${dotSize}px;"></div>`,
    iconSize: [iconSize, iconSize],
    iconAnchor: [iconSize / 2, iconSize / 2],
    popupAnchor: [0, -iconSize / 2]
  });
}

function buildPopupContent(photo) {
  const container = document.createElement('div');
  container.className = 'popup';

  const img = document.createElement('img');
  img.className = 'popup__thumb';
  img.alt = photo.file.name;
  container.appendChild(img);

  if (photo.thumbnail) {
    img.src = photo.thumbnail;
  } else {
    img.classList.add('popup__thumb--loading');
    makeThumbnail(photo).then((url) => {
      if (!url) {
        img.replaceWith(buildThumbnailErrorPlaceholder());
        return;
      }
      photo.thumbnail = url;
      img.src = url;
      img.classList.remove('popup__thumb--loading');
    });
  }

  const info = document.createElement('dl');
  info.className = 'popup__info';
  addInfoRow(info, 'Archivo', photo.file.name);
  const locationDirty = photo.editedLat != null;
  const shownLat = locationDirty ? photo.editedLat : photo.lat;
  const shownLon = locationDirty ? photo.editedLon : photo.lon;
  const locSuffix = locationDirty ? ' (sin guardar)' : photo.hasSavedEdit && photo.lat !== photo.originalLat ? ' (corregida)' : '';
  addInfoRow(info, 'Coordenadas', `${shownLat.toFixed(6)}, ${shownLon.toFixed(6)}${locSuffix}`);
  if (locationDirty || photo.lat !== photo.originalLat || photo.lon !== photo.originalLon) {
    addInfoRow(info, 'Coordenadas originales', `${photo.originalLat.toFixed(6)}, ${photo.originalLon.toFixed(6)}`);
  }
  addInfoRow(info, 'Fecha', photo.date ? photo.date.toLocaleString('es-ES') : 'Desconocida');
  addInfoRow(info, 'Dispositivo', `${photo.make} ${photo.model}`.trim() || 'Desconocido');

  const shownAzimuth = effectiveAzimuth(photo);
  const azDirty = photo.editedAzimuth != null || photo.editedAzimuthCleared;
  const azChanged = photo.azimuth !== photo.originalAzimuth;
  if (shownAzimuth != null) {
    const azSuffix = azDirty ? ' (sin guardar)' : azChanged ? ' (corregido)' : '';
    addInfoRow(info, 'Azimut', `${Math.round(shownAzimuth)}°${azSuffix}`);
  } else if (azDirty || azChanged) {
    addInfoRow(info, 'Azimut', `Sin azimut${azDirty ? ' (sin guardar)' : ' (eliminado)'}`);
  }
  if (azDirty || azChanged) {
    addInfoRow(info, 'Azimut original', photo.originalAzimuth != null ? `${Math.round(photo.originalAzimuth)}°` : 'Sin azimut');
  }
  container.appendChild(info);

  const actions = document.createElement('div');
  actions.className = 'popup__actions';

  const expandBtn = document.createElement('button');
  expandBtn.className = 'btn btn--small';
  expandBtn.type = 'button';
  expandBtn.textContent = 'Ver imagen completa';
  expandBtn.addEventListener('click', () => openLightbox(photo));
  actions.appendChild(expandBtn);

  if (hasWriteAccess) {
    const locationBtn = document.createElement('button');
    locationBtn.className = 'btn btn--small btn--secondary';
    locationBtn.type = 'button';
    locationBtn.textContent = photo.editingLocation ? 'Cancelar edición' : 'Editar ubicación';
    locationBtn.addEventListener('click', () => toggleEditLocation(photo));
    actions.appendChild(locationBtn);

    if (locationDirty) {
      const undoLocationBtn = document.createElement('button');
      undoLocationBtn.className = 'btn btn--small btn--secondary';
      undoLocationBtn.type = 'button';
      undoLocationBtn.textContent = 'Deshacer ubicación';
      undoLocationBtn.addEventListener('click', () => {
        undoLocationEdit(photo);
        photo.marker.closePopup();
      });
      actions.appendChild(undoLocationBtn);
    }

    if (effectiveLat(photo) !== photo.originalLat || effectiveLon(photo) !== photo.originalLon) {
      const revertLocationBtn = document.createElement('button');
      revertLocationBtn.className = 'btn btn--small btn--secondary';
      revertLocationBtn.type = 'button';
      revertLocationBtn.textContent = 'Revertir ubicación a la original';
      revertLocationBtn.addEventListener('click', () => {
        revertLocationToOriginal(photo);
        photo.marker.closePopup();
      });
      actions.appendChild(revertLocationBtn);
    }

    const azimuthBtn = document.createElement('button');
    azimuthBtn.className = 'btn btn--small btn--secondary';
    azimuthBtn.type = 'button';
    azimuthBtn.textContent = photo.editingAzimuth ? 'Cancelar edición' : 'Editar azimut';
    azimuthBtn.addEventListener('click', () => toggleEditAzimuth(photo));
    actions.appendChild(azimuthBtn);

    if (azDirty) {
      const undoAzimuthBtn = document.createElement('button');
      undoAzimuthBtn.className = 'btn btn--small btn--secondary';
      undoAzimuthBtn.type = 'button';
      undoAzimuthBtn.textContent = 'Deshacer azimut';
      undoAzimuthBtn.addEventListener('click', () => {
        undoAzimuthEdit(photo);
        photo.marker.closePopup();
      });
      actions.appendChild(undoAzimuthBtn);
    }

    if (effectiveAzimuth(photo) !== photo.originalAzimuth) {
      const revertAzimuthBtn = document.createElement('button');
      revertAzimuthBtn.className = 'btn btn--small btn--secondary';
      revertAzimuthBtn.type = 'button';
      revertAzimuthBtn.textContent = 'Revertir azimut al original';
      revertAzimuthBtn.addEventListener('click', () => {
        revertAzimuthToOriginal(photo);
        photo.marker.closePopup();
      });
      actions.appendChild(revertAzimuthBtn);
    }
  }

  container.appendChild(actions);

  if (photo.editingLocation) {
    const hint = document.createElement('p');
    hint.className = 'popup__hint';
    hint.textContent = 'Arrastra el marcador en el mapa hasta la posición correcta.';
    container.appendChild(hint);
  } else if (photo.editingAzimuth) {
    const hint = document.createElement('p');
    hint.className = 'popup__hint';
    hint.textContent = 'Arrastra el punto naranja alrededor del marcador para fijar el azimut.';
    container.appendChild(hint);
  }

  return container;
}

function addInfoRow(dl, label, value) {
  const dt = document.createElement('dt');
  dt.textContent = label;
  const dd = document.createElement('dd');
  dd.textContent = value;
  dl.appendChild(dt);
  dl.appendChild(dd);
}

function buildThumbnailErrorPlaceholder() {
  const div = document.createElement('div');
  div.className = 'popup__thumb popup__thumb--error';
  div.textContent = 'Vista previa no disponible';
  return div;
}

// Los navegadores basados en Chromium no decodifican HEIC/HEIF de forma nativa,
// así que esos formatos se convierten a JPEG una vez (con heic2any) y se reutiliza
// el resultado tanto para la miniatura como para la imagen a tamaño completo y el guardado.
async function getDisplayableBlob(photo) {
  if (photo.displayBlob) return photo.displayBlob;
  let blob = photo.file;
  if (isHeicFile(photo.file)) {
    blob = await heic2any({ blob: photo.file, toType: 'image/jpeg', quality: 0.85 });
    if (Array.isArray(blob)) blob = blob[0];
  }
  photo.displayBlob = blob;
  return blob;
}

async function makeThumbnail(photo) {
  try {
    const blob = await getDisplayableBlob(photo);
    const bitmap = await createImageBitmap(blob, { resizeWidth: 280, resizeQuality: 'medium' });
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0);
    bitmap.close();
    return canvas.toDataURL('image/jpeg', 0.82);
  } catch (err) {
    return null;
  }
}

async function openLightbox(photo) {
  lightbox.hidden = false;
  lightboxImg.removeAttribute('src');
  lightboxImg.alt = 'Cargando imagen...';

  try {
    const blob = await getDisplayableBlob(photo);
    if (currentLightboxUrl) URL.revokeObjectURL(currentLightboxUrl);
    currentLightboxUrl = URL.createObjectURL(blob);
    lightboxImg.src = currentLightboxUrl;
    lightboxImg.alt = photo.file.name;
  } catch (err) {
    lightboxImg.alt = 'No se ha podido cargar la imagen a tamaño completo.';
  }
}

function closeLightbox() {
  lightbox.hidden = true;
  lightboxImg.removeAttribute('src');
  if (currentLightboxUrl) {
    URL.revokeObjectURL(currentLightboxUrl);
    currentLightboxUrl = null;
  }
}

// --- Edición de ubicación ---

function toggleEditLocation(photo) {
  photo.editingLocation = !photo.editingLocation;
  if (photo.editingLocation && photo.editingAzimuth) {
    stopEditAzimuth(photo);
  }
  photo.marker.dragging[photo.editingLocation ? 'enable' : 'disable']();
  photo.marker.setIcon(buildMarkerIcon(photo));
  photo.marker.getPopup().update();
  statusEl.textContent = photo.editingLocation
    ? 'Arrastra el marcador a la ubicación correcta y suéltalo.'
    : `${photos.length} fotos cargadas`;
}

function onMarkerDragEnd(photo) {
  const pos = photo.marker.getLatLng();
  photo.editedLat = pos.lat;
  photo.editedLon = pos.lng;
  photo.editingLocation = false;
  photo.marker.dragging.disable();
  photo.marker.setIcon(buildMarkerIcon(photo));
  if (photo.marker.getPopup() && photo.marker.getPopup().isOpen()) {
    photo.marker.getPopup().update();
  }
  saveDirtyCache();
  updateSaveButton();
  statusEl.textContent = 'Ubicación corregida (sin guardar). Pulsa "Guardar cambios" para escribirla en el archivo.';
}

function undoLocationEdit(photo) {
  photo.editedLat = null;
  photo.editedLon = null;
  photo.marker.setLatLng([photo.lat, photo.lon]);
  photo.marker.setIcon(buildMarkerIcon(photo));
  saveDirtyCache();
  updateSaveButton();
}

// Descarta cualquier corrección (pendiente o ya guardada) y deja en cola volver a la
// ubicación original de la cámara. Como cualquier otra edición, hace falta pulsar
// "Guardar cambios" para que se escriba en la copia de /editadas.
function revertLocationToOriginal(photo) {
  photo.editedLat = photo.originalLat;
  photo.editedLon = photo.originalLon;
  photo.marker.setLatLng([photo.originalLat, photo.originalLon]);
  photo.marker.setIcon(buildMarkerIcon(photo));
  saveDirtyCache();
  updateSaveButton();
}

// --- Edición de azimut ---

function toggleEditAzimuth(photo) {
  if (photo.editingAzimuth) {
    stopEditAzimuth(photo);
  } else {
    if (photo.editingLocation) {
      photo.editingLocation = false;
      photo.marker.dragging.disable();
    }
    startEditAzimuth(photo);
  }
  photo.marker.setIcon(buildMarkerIcon(photo));
  photo.marker.getPopup().update();
  statusEl.textContent = photo.editingAzimuth
    ? 'Arrastra el punto naranja alrededor del marcador para fijar el azimut.'
    : `${photos.length} fotos cargadas`;
}

function haloRadius() {
  return BASE_HALO_RADIUS * markerScale;
}

// Calcula la posición geográfica que queda a "radiusPx" píxeles de distancia de
// centerLatLng, en la dirección de bearingDeg (0 = norte, sentido horario).
function pointAtBearing(centerLatLng, bearingDeg, radiusPx) {
  const centerPt = map.latLngToContainerPoint(centerLatLng);
  const rad = (bearingDeg * Math.PI) / 180;
  const pt = L.point(centerPt.x + radiusPx * Math.sin(rad), centerPt.y - radiusPx * Math.cos(rad));
  return map.containerPointToLatLng(pt);
}

function startEditAzimuth(photo) {
  photo.editingAzimuth = true;
  const startAzimuth = photo.editedAzimuth != null ? photo.editedAzimuth : photo.azimuth != null ? photo.azimuth : 0;
  const radius = haloRadius();

  const haloIcon = L.divIcon({
    className: 'azimuth-halo',
    html: '',
    iconSize: [radius * 2, radius * 2],
    iconAnchor: [radius, radius]
  });
  photo.azimuthHalo = L.marker(photo.marker.getLatLng(), {
    icon: haloIcon,
    interactive: false,
    keyboard: false
  }).addTo(photosLayer);

  const handleIcon = L.divIcon({ className: 'azimuth-handle', html: '', iconSize: [16, 16], iconAnchor: [8, 8] });
  const handle = L.marker(pointAtBearing(photo.marker.getLatLng(), startAzimuth, radius), {
    icon: handleIcon,
    draggable: true,
    keyboard: false
  }).addTo(photosLayer);
  photo.azimuthHandle = handle;

  handle.on('drag', () => onAzimuthHandleDrag(photo));
  handle.on('dragend', () => onAzimuthHandleDragEnd(photo));
}

function repositionAzimuthHandle(photo) {
  if (!photo.azimuthHandle) return;
  const azimuth = photo.editedAzimuth != null ? photo.editedAzimuth : photo.azimuth != null ? photo.azimuth : 0;
  photo.azimuthHandle.setLatLng(pointAtBearing(photo.marker.getLatLng(), azimuth, haloRadius()));
}

function onAzimuthHandleDrag(photo) {
  const centerPt = map.latLngToContainerPoint(photo.marker.getLatLng());
  const handlePt = map.latLngToContainerPoint(photo.azimuthHandle.getLatLng());
  const dx = handlePt.x - centerPt.x;
  const dy = handlePt.y - centerPt.y;
  const azimuth = (((Math.atan2(dx, -dy) * 180) / Math.PI) + 360) % 360;
  photo.editedAzimuth = azimuth;
  photo.editedAzimuthCleared = false;
  photo.azimuthHandle.setLatLng(pointAtBearing(photo.marker.getLatLng(), azimuth, haloRadius()));
  photo.marker.setIcon(buildMarkerIcon(photo));
}

function onAzimuthHandleDragEnd(photo) {
  stopEditAzimuth(photo);
  photo.marker.setIcon(buildMarkerIcon(photo));
  if (photo.marker.getPopup() && photo.marker.getPopup().isOpen()) {
    photo.marker.getPopup().update();
  }
  saveDirtyCache();
  updateSaveButton();
  statusEl.textContent = 'Azimut corregido (sin guardar). Pulsa "Guardar cambios" para escribirlo en el archivo.';
}

function stopEditAzimuth(photo) {
  photo.editingAzimuth = false;
  if (photo.azimuthHalo) {
    photosLayer.removeLayer(photo.azimuthHalo);
    photo.azimuthHalo = null;
  }
  if (photo.azimuthHandle) {
    photosLayer.removeLayer(photo.azimuthHandle);
    photo.azimuthHandle = null;
  }
}

function undoAzimuthEdit(photo) {
  photo.editedAzimuth = null;
  photo.editedAzimuthCleared = false;
  if (photo.editingAzimuth) stopEditAzimuth(photo);
  photo.marker.setIcon(buildMarkerIcon(photo));
  saveDirtyCache();
  updateSaveButton();
}

// Descarta cualquier corrección de azimut (pendiente o ya guardada) y deja en cola volver
// al azimut original: si la foto no tenía azimut de origen, la cola es "quitarlo".
function revertAzimuthToOriginal(photo) {
  if (photo.originalAzimuth != null) {
    photo.editedAzimuth = photo.originalAzimuth;
    photo.editedAzimuthCleared = false;
  } else {
    photo.editedAzimuth = null;
    photo.editedAzimuthCleared = true;
  }
  if (photo.editingAzimuth) stopEditAzimuth(photo);
  photo.marker.setIcon(buildMarkerIcon(photo));
  saveDirtyCache();
  updateSaveButton();
}

// --- Guardado y caché de cambios pendientes ---

function hasPendingChanges() {
  return photos.some(isDirty);
}

function updateSaveButton() {
  const dirtyCount = photos.filter(isDirty).length;
  if (dirtyCount > 0) {
    saveChangesBtn.hidden = false;
    saveChangesBtn.textContent = `Guardar cambios (${dirtyCount})`;
  } else {
    saveChangesBtn.hidden = true;
  }
}

function cacheKey() {
  return `georefotos:pending:${currentRootName}`;
}

function saveDirtyCache() {
  if (!currentRootName) return;
  const dirty = photos.filter(isDirty).map((p) => ({
    relativePath: p.relativePath,
    lat: p.editedLat,
    lon: p.editedLon,
    azimuth: p.editedAzimuth,
    azimuthCleared: p.editedAzimuthCleared
  }));
  if (dirty.length > 0) {
    localStorage.setItem(cacheKey(), JSON.stringify(dirty));
  } else {
    localStorage.removeItem(cacheKey());
  }
}

function restorePendingFromCache(photo) {
  if (!currentRootName) return;
  try {
    const raw = localStorage.getItem(cacheKey());
    if (!raw) return;
    const list = JSON.parse(raw);
    const match = list.find((e) => e.relativePath === photo.relativePath);
    if (match) {
      if (match.lat != null && match.lon != null) {
        photo.editedLat = match.lat;
        photo.editedLon = match.lon;
        photo.marker.setLatLng([match.lat, match.lon]);
      }
      if (match.azimuthCleared) {
        photo.editedAzimuthCleared = true;
      } else if (match.azimuth != null) {
        photo.editedAzimuth = match.azimuth;
      }
      photo.marker.setIcon(buildMarkerIcon(photo));
    }
  } catch (err) {
    localStorage.removeItem(cacheKey());
  }
}

async function saveAllChanges() {
  const dirty = photos.filter(isDirty);
  if (dirty.length === 0) return;

  if (!editadasDirHandle) {
    try {
      editadasDirHandle = await rootDirHandle.getDirectoryHandle(EDITED_FOLDER_NAME, { create: true });
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'No se ha podido crear la carpeta "editadas".';
      return;
    }
  }

  saveChangesBtn.disabled = true;
  let done = 0;
  let failed = 0;

  for (const photo of dirty) {
    statusEl.textContent = `Guardando ${done + failed + 1}/${dirty.length}...`;
    try {
      await savePhotoLocation(photo, editadasDirHandle);
      photo.lat = effectiveLat(photo);
      photo.lon = effectiveLon(photo);
      photo.azimuth = effectiveAzimuth(photo);
      photo.editedLat = null;
      photo.editedLon = null;
      photo.editedAzimuth = null;
      photo.editedAzimuthCleared = false;
      photo.hasSavedEdit = true;
      photo.marker.setIcon(buildMarkerIcon(photo));
      done += 1;
    } catch (err) {
      console.error('No se pudo guardar la corrección de', photo.relativePath, err);
      failed += 1;
    }
  }

  saveDirtyCache();
  updateSaveButton();
  saveChangesBtn.disabled = false;
  statusEl.textContent =
    failed > 0
      ? `Guardado en /editadas: ${done} foto(s) ok, ${failed} con error (revisa la consola del navegador).`
      : `Guardado en /editadas: ${done} foto(s).`;
}

</script>
</body>
