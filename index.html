<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoRefotos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="toolbar">
  <h1 class="toolbar__title">GeoRefotos</h1>
  <button id="select-folder-btn" class="btn" type="button">Seleccionar carpeta&hellip;</button>
  <input id="folder-input" type="file" webkitdirectory directory multiple accept="image/*" hidden />
  <button id="save-changes-btn" class="btn btn--save" type="button" hidden>Guardar cambios</button>
  <label class="scale-control">
    Tamaño de los puntos
    <input id="marker-scale" type="range" min="0" max="2" step="1" value="0" list="marker-scale-ticks" />
    <datalist id="marker-scale-ticks">
      <option value="0"></option>
      <option value="1"></option>
      <option value="2"></option>
    </datalist>
    <span id="marker-scale-label">x1</span>
  </label>
  <span id="status" class="status">Selecciona una carpeta con fotos para empezar.</span>
</header>

<main id="map"></main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox__close" aria-label="Cerrar" type="button">&times;</button>
  <img id="lightbox-img" class="lightbox__img" alt="Foto a tamaño completo" />
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
<script src="js/layers.js"></script>
<script src="js/exif-writer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
