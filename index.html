<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoRefotos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="toolbar">
  <h1 class="toolbar__title">GeoRefotos</h1>
  <button id="select-folder-btn" class="btn">Seleccionar carpeta&hellip;</button>
  <input id="folder-input" type="file" webkitdirectory directory multiple accept="image/*" hidden />
  <span id="status" class="status">Selecciona una carpeta con fotos para empezar.</span>
</header>

<main id="map"></main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightbox-close" class="lightbox__close" aria-label="Cerrar">&times;</button>
  <img id="lightbox-img" class="lightbox__img" alt="Foto a tamaño completo" />
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="js/layers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
